name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.goos }}_${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="wordle-tui_${version}_${GOOS}_${GOARCH}.tar.gz"
          # Binary at the tarball root so the Homebrew formula can `bin.install "wordle-tui"`.
          tar -C "target/${TARGET}/release" -czf "$asset" wordle-tui
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          generate_release_notes: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}

  formula:
    name: Generate Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render wordle-tui.rb
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/danfry1/wordle-tui/releases/download/${GITHUB_REF_NAME}"
          sha() { sha256sum "dist/wordle-tui_${version}_$1.tar.gz" | awk '{print $1}'; }
          darwin_amd64="$(sha darwin_amd64)"
          darwin_arm64="$(sha darwin_arm64)"
          linux_amd64="$(sha linux_amd64)"
          linux_arm64="$(sha linux_arm64)"
          cat > wordle-tui.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file is generated by the release workflow. DO NOT EDIT.
          class WordleTui < Formula
            desc "Beautiful terminal word-guessing game built with ratatui"
            homepage "https://github.com/danfry1/wordle-tui"
            version "${version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "${base}/wordle-tui_${version}_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64}"

                def install
                  bin.install "wordle-tui"
                end
              end
              if Hardware::CPU.arm?
                url "${base}/wordle-tui_${version}_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64}"

                def install
                  bin.install "wordle-tui"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "${base}/wordle-tui_${version}_linux_amd64.tar.gz"
                sha256 "${linux_amd64}"

                def install
                  bin.install "wordle-tui"
                end
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "${base}/wordle-tui_${version}_linux_arm64.tar.gz"
                sha256 "${linux_arm64}"

                def install
                  bin.install "wordle-tui"
                end
              end
            end

            test do
              assert_match "wordle-tui #{version}", shell_output("#{bin}/wordle-tui --version")
            end
          end
          EOF
          echo "----- generated wordle-tui.rb -----"
          cat wordle-tui.rb

      - name: Attach formula to release
        uses: softprops/action-gh-release@v2
        with:
          files: wordle-tui.rb
