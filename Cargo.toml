[package]
name = "wordle-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A beautiful terminal word-guessing game built with ratatui"
authors = ["Daniel Fry"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/danfry1/wordle-tui"
homepage = "https://github.com/danfry1/wordle-tui"
keywords = ["wordle", "game", "tui", "ratatui", "terminal"]
categories = ["games", "command-line-utilities"]
exclude = [".github/", "packaging/", "demo/", "flake.nix", "flake.lock", "*.png"]

# Supply-chain notes:
# - Single direct dependency to minimize attack surface.
# - ratatui re-exports its crossterm backend (ratatui::crossterm), so we avoid
#   a separate crossterm dependency and any version skew between the two.
# - Randomness uses std (SystemTime), so no `rand` dependency is needed.
# - Cargo.lock is committed for reproducible builds; run `cargo audit` in CI.
[dependencies]
ratatui = "0.30.1"

[profile.release]
opt-level = 3
lto = true
strip = true
