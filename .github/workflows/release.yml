name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write # upload release assets
    name: Build ${{ matrix.goos }}_${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="wordle-tui_${version}_${GOOS}_${GOARCH}.tar.gz"
          # Binary at the tarball root so the Homebrew formula can `bin.install "wordle-tui"`.
          tar -C "target/${TARGET}/release" -czf "$asset" wordle-tui
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.package.outputs.asset }}
          generate_release_notes: true

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}

  formula:
    permissions:
      contents: write # upload release assets
    name: Generate Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Render wordle-tui.rb
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/danfry1/wordle-tui/releases/download/${GITHUB_REF_NAME}"
          sha() { sha256sum "dist/wordle-tui_${version}_$1.tar.gz" | awk '{print $1}'; }
          darwin_amd64="$(sha darwin_amd64)"
          darwin_arm64="$(sha darwin_arm64)"
          linux_amd64="$(sha linux_amd64)"
          linux_arm64="$(sha linux_arm64)"
          cat > wordle-tui.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # This file is generated by the release workflow. DO NOT EDIT.
          class WordleTui < Formula
            desc "Beautiful terminal word-guessing game built with ratatui"
            homepage "https://github.com/danfry1/wordle-tui"
            version "${version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "${base}/wordle-tui_${version}_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64}"

                def install
                  bin.install "wordle-tui"
                end
              end
              if Hardware::CPU.arm?
                url "${base}/wordle-tui_${version}_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64}"

                def install
                  bin.install "wordle-tui"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "${base}/wordle-tui_${version}_linux_amd64.tar.gz"
                sha256 "${linux_amd64}"

                def install
                  bin.install "wordle-tui"
                end
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "${base}/wordle-tui_${version}_linux_arm64.tar.gz"
                sha256 "${linux_arm64}"

                def install
                  bin.install "wordle-tui"
                end
              end
            end

            test do
              assert_match "wordle-tui #{version}", shell_output("#{bin}/wordle-tui --version")
            end
          end
          EOF
          echo "----- generated wordle-tui.rb -----"
          cat wordle-tui.rb

      - name: Attach formula to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: wordle-tui.rb

  # Runs after every asset is on the release, in the same run that built them, and
  # signs build provenance for the published files. Kept separate from the build and
  # tap/bucket jobs so a problem here cannot fail or block an otherwise good release.
  # Verify a download with: gh attestation verify <file> --repo "$GITHUB_REPOSITORY"
  attest:
    name: Attest build provenance
    needs: formula
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # download the release assets
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f -- *.sha256 checksums.txt SHA256SUMS
          sha256sum -- $(ls | grep -vx SHA256SUMS) > "$RUNNER_TEMP/subjects.txt"
          test -s "$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
