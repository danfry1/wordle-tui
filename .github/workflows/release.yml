name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write # upload release assets
    name: Build ${{ matrix.goos }}_${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="wordle-tui_${version}_${GOOS}_${GOARCH}.tar.gz"
          # Binary at the tarball root so the Homebrew formula can `bin.install "wordle-tui"`.
          tar -C "target/${TARGET}/release" -czf "$asset" wordle-tui
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.package.outputs.asset }}
          generate_release_notes: true

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}

  # Open a pull request on danfry1/homebrew-tap that points wordle-tui.rb at this
  # tag's source archive. The tap's CI builds and tests bottles on that pull
  # request; publishing them is a manual `brew pr-pull` run in the tap. The
  # push and the pull request use a short-lived App token scoped to the tap.
  homebrew-formula:
    name: Open Homebrew formula PR
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mint a tap token from the GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TAP_BUMP_APP_ID }}
          private-key: ${{ secrets.TAP_BUMP_APP_PRIVATE_KEY }}
          owner: danfry1
          repositories: homebrew-tap

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danfry1/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Point the formula at this tag's source archive
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          FORMULA: wordle-tui
        run: |
          set -euo pipefail
          url="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl --fail --silent --show-error --location --retry 3 "$url" | sha256sum | cut -d' ' -f1)
          file="tap/${FORMULA}.rb"
          # A new version starts at revision 0, so drop any revision line.
          # Drop the bottle block: its bottles belong to the old version. Publishing
          # the tap pull request (brew pr-pull) writes a new block; if the PR is
          # merged without publishing, the formula builds from source instead of
          # pointing at bottles that do not exist.
          sed -i -E \
            -e "s#^  url \"[^\"]*\"#  url \"${url}\"#" \
            -e "s#^  sha256 \"[0-9a-f]*\"#  sha256 \"${sha}\"#" \
            -e '/^  bottle do$/,/^  end$/d' \
            -e '/^  revision [0-9]+$/d' \
            "$file"
          # Removing the block leaves two blank lines; brew style allows one.
          cat -s "$file" > "$file.new" && mv "$file.new" "$file"
          grep -qF "url \"${url}\"" "$file"
          grep -qF "sha256 \"${sha}\"" "$file"
          ! grep -q '^  bottle do$' "$file"
          cat "$file"

      - name: Push a branch and open the pull request
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          FORMULA: wordle-tui
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet; then
            echo "Formula already points at ${TAG}; nothing to do."
            exit 0
          fi
          version="${TAG#v}"
          branch="${FORMULA}-${version}"
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "${FORMULA} ${version}"
          # A re-run replaces the bot's own branch; main is never force-pushed.
          git push --force origin "$branch"
          if [ -n "$(gh pr list --repo danfry1/homebrew-tap --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "Pull request for ${branch} already open; branch updated."
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          pr_url=$(gh pr create --repo danfry1/homebrew-tap --base main --head "$branch" \
            --title "${FORMULA} ${version}" \
            --body "Points \`${FORMULA}.rb\` at the ${TAG} source archive, opened by the ${REPO} release workflow. Publish the bottles once CI is green (do not use the merge button).")
          gh pr comment "$pr_url" --body "Publish: \`gh workflow run publish.yml -R danfry1/homebrew-tap -f pull_request=${pr_url##*/} -f head_sha=${head_sha}\`"

  # Runs after every asset is on the release, in the same run that built them, and
  # signs build provenance for the published files. Kept separate from the build and
  # tap/bucket jobs so a problem here cannot fail or block an otherwise good release.
  # Verify a download with: gh attestation verify <file> --repo "$GITHUB_REPOSITORY"
  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # download the release assets
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f -- *.sha256 checksums.txt SHA256SUMS
          sha256sum -- $(ls | grep -vx SHA256SUMS) > "$RUNNER_TEMP/subjects.txt"
          test -s "$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
